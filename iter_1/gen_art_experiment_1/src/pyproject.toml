[project]
name = "fol-fragment-validation"
version = "0.1.0"
description = "Pilot experiment for validating LLM-generated FOL fragment quality"
requires-python = ">=3.12"
dependencies = [
    "loguru==0.7.3",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "sentence-transformers==5.5.1",
    "datasets==4.8.5",
    "requests==2.34.2",
    "jsonschema==4.26.0",
    "torch==2.12.0",
    "transformers==5.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
